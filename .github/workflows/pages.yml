name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m py_compile deploy/install-vps.py deploy/auto-deploy.py
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - run: node --check server.mjs && node --check economy.mjs && node --check fx.mjs && node --check public/app.js && node --check public/engine.js
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4



  live-site-probe:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live VPS serves the actual mobile landing with embedded image
        shell: bash
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl --silent --show-error --location --max-time 20 --output /tmp/quorum-live.html --write-out '%{http_code}' 'https://cityai.site/quorum/' || true)
            bytes=$(wc -c < /tmp/quorum-live.html 2>/dev/null || echo 0)
            csscode=$(curl --silent --show-error --location --max-time 20 --output /tmp/quorum-live.css --write-out '%{http_code}' 'https://cityai.site/quorum/uiux32.css?v=landing59' || true)
            echo "Attempt $i: HTML=$code CSS=$csscode bytes=$bytes"
            if [ "$code" = "200" ] && [ "$csscode" = "200" ] \
              && grep -qF 'app.js?v=landing57' /tmp/quorum-live.html \
              && grep -qF 'uiux32.css?v=landing59' /tmp/quorum-live.html \
              && grep -qF 'data:image/webp;base64,UklGR' /tmp/quorum-live.html \
              && grep -qF 'html:has(body.landing-visible){height:100%' /tmp/quorum-live.css \
              && grep -qF 'body.landing-visible{position:fixed;inset:0' /tmp/quorum-live.css \
              && grep -qF 'width:min(100vw,530px,calc(78.027svh - 110px))!important' /tmp/quorum-live.css; then
              echo "PASS: Live VPS serves landing59: inline WebP, full-bleed background and stable Safari viewport."
              exit 0
            fi
            grep -oE 'uiux32.css\?v=[A-Za-z0-9_-]+' /tmp/quorum-live.html | head -1 || true
            sleep 15
          done
          echo "::error::Live VPS has not picked up the new landing page. Inspect quorum-deploy.timer, quorum-deploy.service and /var/lib/quorum/failed-revision."
          exit 1
