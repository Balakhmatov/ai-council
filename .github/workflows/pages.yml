name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m py_compile deploy/install-vps.py deploy/auto-deploy.py
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - run: node --check server.mjs && node --check economy.mjs && node --check fx.mjs && node --check public/app.js && node --check public/engine.js
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4



  live-site-probe:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live Quorum VPS serves all scene presets and cinematic AI characters
        shell: bash
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            code=$(curl --silent --show-error --location --max-time 20 --output /tmp/quorum-live.html --write-out '%{http_code}' 'https://cityai.site/quorum/' || true)
            bytes=$(wc -c < /tmp/quorum-live.html 2>/dev/null || echo 0)
            csscode=$(curl --silent --show-error --location --max-time 20 --output /tmp/quorum-live.css --write-out '%{http_code}' 'https://cityai.site/quorum/uiux32.css?v=show65' || true)
            enginecode=$(curl --silent --show-error --location --max-time 20 --output /tmp/quorum-engine.js --write-out '%{http_code}' 'https://cityai.site/quorum/engine.js' || true)
            appcode=$(curl --silent --show-error --location --max-time 20 --output /tmp/quorum-app.js --write-out '%{http_code}' 'https://cityai.site/quorum/app.js?v=show66' || true)
            showcode=$(curl --silent --show-error --location --max-time 20 --output /tmp/quorum-show.js --write-out '%{http_code}' 'https://cityai.site/quorum/show.js' || true)
            artcode=$(curl --silent --show-error --location --max-time 20 --output /tmp/quorum-show-art.js --write-out '%{http_code}' 'https://cityai.site/quorum/show-art.js' || true)
            healthcode=$(curl --silent --show-error --location --max-time 20 --output /tmp/quorum-health.json --write-out '%{http_code}' 'https://cityai.site/quorum/healthz' || true)
            echo "Attempt $i: HTML=$code CSS=$csscode ENGINE=$enginecode APP=$appcode SHOW=$showcode ART=$artcode HEALTH=$healthcode bytes=$bytes"
            if [ "$code" = "200" ] && [ "$csscode" = "200" ] && [ "$enginecode" = "200" ] && [ "$appcode" = "200" ] && [ "$showcode" = "200" ] && [ "$artcode" = "200" ] && [ "$healthcode" = "200" ] \
              && grep -qF 'app.js?v=show66' /tmp/quorum-live.html \
              && grep -qF 'uiux32.css?v=show65' /tmp/quorum-live.html \
              && grep -qF 'data:image/webp;base64,UklGR' /tmp/quorum-live.html \
              && grep -qF 'html:has(body.landing-visible){height:100%' /tmp/quorum-live.css \
              && grep -qF 'body.landing-visible{position:fixed;inset:0' /tmp/quorum-live.css \
              && grep -qF 'width:min(100vw,530px,calc(78.027svh - 110px))!important' /tmp/quorum-live.css \
              && grep -qF 'roastRules' /tmp/quorum-engine.js \
              && grep -qF "label:'🎬 Тарантино'" /tmp/quorum-engine.js \
              && grep -qF 'id="ambience"' /tmp/quorum-live.html \
              && grep -qF 'Object.entries(ambiences)' /tmp/quorum-app.js \
              && grep -qF 'roastModeNote' /tmp/quorum-app.js \
              && grep -qF '#modes .mode-roast.active' /tmp/quorum-live.css \
              && grep -qF '"mistralModel":"mistral-large-4"' /tmp/quorum-health.json \
              && grep -qF 'id="experienceShow"' /tmp/quorum-live.html \
              && grep -qF 'id="showRandomCast"' /tmp/quorum-live.html \
              && grep -qF 'runShow' /tmp/quorum-show.js \
              && grep -qF 'scenePoster' /tmp/quorum-show-art.js \
              && grep -qF 'scenePoster' /tmp/quorum-app.js \
              && grep -qF 'mode:isShow?' /tmp/quorum-app.js; then
              echo "PASS: Live VPS serves Show64 with ten illustrated scenes, actor casting, compact dialogue and Mistral Large 4."
              exit 0
            fi
            grep -oE 'uiux32.css\?v=[A-Za-z0-9_-]+' /tmp/quorum-live.html | head -1 || true
            sleep 15
          done
          echo "::error::Live VPS has not activated Show64 and compact dialogue. Inspect quorum-deploy.timer and quorum-deploy.service."
          exit 1
