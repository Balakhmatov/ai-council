name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m py_compile deploy/install-vps.py deploy/auto-deploy.py
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - run: node --check server.mjs && node --check economy.mjs && node --check fx.mjs && node --check public/app.js && node --check public/engine.js
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4



  live-site-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public Quorum deployment without credentials
        shell: bash
        run: |
          set +e
          echo "Expected currently merged main: ${{ github.event.pull_request.base.sha }}"
          echo "DNS:"
          getent ahostsv4 cityai.site | head -3
          echo "=== Public HTML ==="
          curl --silent --show-error --location --max-time 20 --write-out '\nHTTP_CODE=%{http_code} FINAL_URL=%{url_effective}\n' -o /tmp/quorum-live.html https://cityai.site/quorum/
          if test -s /tmp/quorum-live.html; then
            grep -oE 'app.js\\?v=[A-Za-z0-9_-]+|style.css\\?v=[A-Za-z0-9_-]+|id="pricingOpen"|id="pricingDialog"' /tmp/quorum-live.html | head -20 || true
            echo "HTML bytes: $(wc -c < /tmp/quorum-live.html)"
          fi
          echo "=== VPS health and deployment stamp ==="
          curl --silent --show-error --location --max-time 20 --write-out '\nHTTP_CODE=%{http_code}\n' https://cityai.site/quorum/healthz
          echo
